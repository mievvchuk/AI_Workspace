<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Workspace: навчальний простір з AI для студентів" />
    <meta property="og:description" content="Асистент відповідає з ваших лекцій, розбирає лабораторні й перевіряє знання, а кожен його крок видно в журналі." />
    <meta property="og:image" content="/share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- <link rel="canonical" href="https://the-client-domain/"> : the domain is still to come -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wdth,wght@85..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>AI Workspace: навчальний простір з AI для студентів</title>
    <meta name="description" content="Предмети, матеріали, лабораторні й діагностика знань в одному місці. Асистент відповідає з ваших лекцій і показує кожен крок своєї роботи." />
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem("aiw-ui") || "{}").state?.theme || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
